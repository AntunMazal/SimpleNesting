<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleNesting - Repozitorij</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/Primer/21.3.6/primer.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
        .gh-header { background-color: #161b22; padding: 16px; border-bottom: 1px solid #30363d; }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 16px; }
        .file-box { background-color: #161b22; border: 1px solid #30363d; border-radius: 6px; overflow: hidden; }
        .file-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #30363d; font-size: 14px; }
        .file-item:last-child { border-bottom: none; }
        .file-item:hover { background-color: #1f242c; }
        .file-info { display: flex; align-items: center; gap: 10px; }
        .file-icon { color: #8b949e; width: 16px; text-align: center; }
        .folder-icon { color: #58a6ff; }
        a { color: #58a6ff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .btn-custom { background-color: #238636; color: white; border: 1px solid rgba(240,246,252,0.1); border-radius: 6px; padding: 5px 16px; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
        .btn-custom:hover { background-color: #2ea043; color: white; text-decoration: none; }
    </style>
</head>
<body>

    <div class="gh-header">
        <div style="max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <i class="fab fa-github" style="font-size: 32px; color: #f0f6fc;"></i>
                <strong style="color: #f0f6fc; font-size: 16px;">AntunMazal / <a href="https://github.com/AntunMazal/SimpleNesting" target="_blank">SimpleNesting</a></strong>
                <span class="Label Label--secondary" style="color: #8b949e; border-color: #30363d;">Public</span>
            </div>
            <a href="https://github.com/AntunMazal/SimpleNesting" target="_blank" class="btn-custom"><i class="fas fa-code"></i> Otvori na GitHubu</a>
        </div>
    </div>

    <div class="container">
        <h2 style="color: #f0f6fc; margin-bottom: 20px;"><i class="fas fa-folder-open"></i> Pregled datoteka projekta</h2>

        <div class="file-box" id="file-list">
            <div class="file-item" style="color: #8b949e;">Učitavam datoteke s GitHuba...</div>
        </div>
    </div>

    <script>
        const repoUrl = "https://api.github.com/repos/AntunMazal/SimpleNesting/contents/";

        async function fetchFiles() {
            const listElement = document.getElementById("file-list");
            try {
                const response = await fetch(repoUrl);
                if (!response.ok) {
                    throw new Error("HTTP " + response.status);
                }
                const files = await response.json();
                listElement.innerHTML = "";

                // Mape prve, zatim datoteke
                files.sort((a, b) => (b.type === 'dir') - (a.type === 'dir'));

                files.forEach(file => {
                    const isFolder = file.type === "dir";
                    const iconClass = isFolder ? "fas fa-folder folder-icon" : "far fa-file-alt";
                    const sizeText = isFolder ? "" : (file.size / 1024).toFixed(1) + " KB";

                    const item = document.createElement("div");
                    item.className = "file-item";
                    item.innerHTML = `
                        <div class="file-info">
                            <i class="${iconClass} file-icon"></i>
                            <a href="${file.html_url}" target="_blank" style="${isFolder ? 'font-weight: 600;' : ''}">${file.name}</a>
                        </div>
                        <span style="color: #8b949e; font-size: 12px;">${sizeText}</span>
                    `;
                    listElement.appendChild(item);
                });
            } catch (error) {
                console.error(error);
                listElement.innerHTML = `<div class="file-item" style="color: #f85149;">Greška pri učitavanju datoteka (${error.message}).</div>`;
            }
        }

        fetchFiles();
    </script>
</body>
</html>
