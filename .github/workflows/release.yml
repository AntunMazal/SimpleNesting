name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-glx0 libxcb-shm0 libx11-xcb1 libgl1 libxkbcommon-x11-0

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: |
          python build.py --clean

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simplenesting-${{ matrix.os }}
          path: dist/simplenesting/
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create release archives
        run: |
          mkdir -p dist
          for dir in artifacts/simplenesting-*/; do
            platform=$(basename "$dir" | sed 's/simplenesting-//')
            if [ "$platform" = "ubuntu-latest" ]; then platform="linux"; fi
            if [ "$platform" = "windows-latest" ]; then platform="windows"; fi
            if [ "$platform" = "macos-latest" ]; then platform="macos"; fi
            echo "Packaging $platform..."
            cd "$dir"
            if [ "$platform" = "windows" ]; then
              zip -r /home/runner/work/dist/simplenesting-windows.zip ./*
            else
              tar czf /home/runner/work/dist/simplenesting-${platform}.tar.gz ./*
            fi
            cd /home/runner/work/dist
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip dist/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}