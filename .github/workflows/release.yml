name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-glx0 libxcb-shm0 libx11-xcb1 libgl1 libxkbcommon-x11-0

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: |
          python build.py --clean

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simplenesting-${{ matrix.os }}
          path: dist/   # <--- PROMJENA: Umjesto dist/simplenesting/, dižemo cijelu dist mapu da sigurno uhvati sve unutra!
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: simplenesting-ubuntu-latest
          path: artifacts/simplenesting-ubuntu-latest

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: simplenesting-windows-latest
          path: artifacts/simplenesting-windows-latest

      - name: Create release archives
        run: |
          mkdir -p dist
          
          # Linux - uzima sve što je PyInstaller izbacio u dist mapi
          if [ -d "artifacts/simplenesting-ubuntu-latest" ]; then
            echo "Packaging linux..."
            cd artifacts/simplenesting-ubuntu-latest
            # Pronađi prvi podfolder ili zipaj sadržaj
            tar czf ../../dist/simplenesting-linux.tar.gz .
            cd ../../
          fi
          
          # Windows - uzima sve što je PyInstaller izbazio za Windowse
          if [ -d "artifacts/simplenesting-windows-latest" ]; then
            echo "Packaging windows..."
            cd artifacts/simplenesting-windows-latest
            zip -r ../../dist/simplenesting-windows.zip .
            cd ../../
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/simplenesting-linux.tar.gz
            dist/simplenesting-windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
